name: Build

on:
  push:
    branches: ["**", "!votes"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
      - uses: actions/checkout@v4

      - name: Check release tooling and roadmap
        run: |
          python3 tools/test-release-bundle.py
          python3 tools/render-roadmap.py --check

      - name: Restore third-party libraries
        uses: actions/cache@v4
        with:
          path: deps/install
          key: deps-${{ hashFiles('tools/build-deps.sh', 'tools/patches/**') }}
          # Start from an older cache: per-library stamps rebuild only what changed.
          restore-keys: deps-

      - name: Build third-party libraries
        run: ./tools/build-deps.sh

      - name: Build CoffeeFlix
        # The app compares its version with the latest release's tag to offer updates.
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) version="dev-$(echo "$GITHUB_SHA" | cut -c1-7)" ;; esac
          make -j"$(nproc)" APP_VERSION="$version"

      - name: Package
        run: |
          mkdir -p dist/wiiu/apps/coffeeflix
          cp coffeeflix.wuhb LICENSE.md content/licenses/NOTICES.txt dist/wiiu/apps/coffeeflix/
          (cd dist && zip -qr ../coffeeflix.zip wiiu)
          # Tiramisu: a bare .rpx for the Homebrew Launcher, with the bundled files beside it.
          app=dist-tiramisu/wiiu/apps/coffeeflix
          mkdir -p "$app"
          cp -r coffeeflix.rpx content LICENSE.md "$app/"
          cp branding/hbl_icon.png "$app/icon.png"
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) version="dev-$(echo "$GITHUB_SHA" | cut -c1-7)" ;; esac
          cat > "$app/meta.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <app version="1">
            <name>CoffeeFlix</name>
            <coder>Roastedd</coder>
            <version>$version</version>
            <short_description>YouTube, Twitch, Jellyfin, radio, podcasts and your media</short_description>
            <long_description>A media app for the Wii U. This is the Tiramisu build; on Aroma, use coffeeflix.wuhb instead.</long_description>
          </app>
          EOF
          (cd dist-tiramisu && zip -qr ../coffeeflix-tiramisu.zip wiiu)

      - name: Record release candidate files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 tools/release-bundle.py create --version "${GITHUB_REF_NAME#v}" --commit "$GITHUB_SHA"
          python3 tools/release-bundle.py verify

      - uses: actions/upload-artifact@v4
        with:
          name: coffeeflix-${{ github.sha }}
          path: |
            coffeeflix.zip
            coffeeflix.wuhb
            coffeeflix-tiramisu.zip
            release-manifest.json
            SHA256SUMS.txt
          if-no-files-found: error

  draft:
    needs: build
    if: github.repository == 'Roastedd/CoffeeFlix' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: draft-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coffeeflix-${{ github.sha }}
          path: candidate
      - name: Verify packaged candidate
        run: python3 tools/release-bundle.py verify --directory candidate
      - name: Create a draft for testing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Creation fails if this release exists. Never overwrite reviewed assets on a rerun.
          gh release create "$TAG" candidate/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "CoffeeFlix $TAG" --generate-notes \
            --notes-file .github/release-notes.md
