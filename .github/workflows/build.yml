name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore third-party libraries
        uses: actions/cache@v4
        with:
          path: deps/install
          key: deps-${{ hashFiles('tools/build-deps.sh', 'tools/patches/**') }}
          # Start from an older cache: per-library stamps rebuild only what changed.
          restore-keys: deps-

      - name: Build third-party libraries
        run: ./tools/build-deps.sh

      - name: Build CoffeeFlix
        run: make -j"$(nproc)"

      - name: Package
        run: |
          mkdir -p dist/wiiu/apps/coffeeflix
          cp coffeeflix.wuhb LICENSE.md content/licenses/NOTICES.txt dist/wiiu/apps/coffeeflix/
          (cd dist && zip -qr ../coffeeflix.zip wiiu)
          # Tiramisu: a bare .rpx for the Homebrew Launcher, with the bundled files beside it.
          app=dist-tiramisu/wiiu/apps/coffeeflix
          mkdir -p "$app"
          cp -r coffeeflix.rpx content LICENSE.md "$app/"
          cp branding/hbl_icon.png "$app/icon.png"
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) version="dev-$(echo "$GITHUB_SHA" | cut -c1-7)" ;; esac
          cat > "$app/meta.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <app version="1">
            <name>CoffeeFlix</name>
            <coder>Roastedd</coder>
            <version>$version</version>
            <short_description>YouTube, Twitch, Jellyfin, radio, podcasts and your media</short_description>
            <long_description>A media app for the Wii U. This is the Tiramisu build; on Aroma, use coffeeflix.wuhb instead.</long_description>
          </app>
          EOF
          (cd dist-tiramisu && zip -qr ../coffeeflix-tiramisu.zip wiiu)

      - uses: actions/upload-artifact@v4
        with:
          name: coffeeflix-${{ github.sha }}
          path: |
            dist/
            dist-tiramisu/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            coffeeflix.zip
            coffeeflix.wuhb
            coffeeflix-tiramisu.zip
          generate_release_notes: true
          body: |
            **Install:** extract `coffeeflix.zip` to the root of your SD card (or put `coffeeflix.wuhb` in `sd:/wiiu/apps/coffeeflix/`) and start CoffeeFlix from the Wii U Menu. Needs [Aroma](https://aroma.foryour.cafe).

            **Tiramisu:** use `coffeeflix-tiramisu.zip` instead (extract it to the root of your SD card and start CoffeeFlix from the Homebrew Launcher). This build is new and less tested, so please report how it goes.

            ☕ Enjoying CoffeeFlix? You can support it on [Ko-fi](https://ko-fi.com/ubecatstudio).
