name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore third-party libraries
        uses: actions/cache@v4
        with:
          path: deps/install
          key: deps-${{ hashFiles('tools/build-deps.sh') }}

      - name: Build third-party libraries
        run: ./tools/build-deps.sh

      - name: Build CoffeeFlix
        run: make -j"$(nproc)"

      - name: Package
        run: |
          mkdir -p dist/wiiu/apps/coffeeflix
          cp coffeeflix.wuhb dist/wiiu/apps/coffeeflix/
          cd dist && zip -qr ../coffeeflix.zip wiiu

      - uses: actions/upload-artifact@v4
        with:
          name: coffeeflix-${{ github.sha }}
          path: |
            dist/
            coffeeflix.rpx

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            coffeeflix.zip
            coffeeflix.wuhb
          generate_release_notes: true
