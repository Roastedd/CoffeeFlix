  const r=await fetch(base+'upload',{headers:{'X-Upload-Key':key,'X-Upload-Id':item.id,'X-Total-Size':String(item.file.size)},cache:'no-store'}),v=await r.json();

 }catch{return -1;}
}
function fail(message,stop){const e=new Error(message);e.final=true;e.stop=!!stop;return e;}
// One PUT of the file from `offset` on; resolves with the answer, rejects when the connection breaks.
function put(item,offset,index,count,folder){return new Promise((resolve,reject)=>{
 const xhr=request=new XMLHttpRequest();let last=Date.now(),stalled=false;
 const samples=[[Date.now(),offset]];
 xhr.open('PUT',base+'upload');
 for(const [k,v] of Object.entries({'Content-Type':'application/octet-stream','X-Upload-Key':key,'X-File-Name':encodeURIComponent(item.name),'X-Upload-Id':item.id,'X-Upload-Offset':String(offset),'X-Total-Size':String(item.file.size),'X-Queue-Index':String(index),'X-Queue-Count':String(count)}))xhr.setRequestHeader(k,v);
 if(folder)xhr.setRequestHeader('X-Folder',encodeURIComponent(folder));
 const watch=setInterval(()=>{if(Date.now()-last>20000){stalled=true;xhr.abort();}},2000);
 xhr.upload.onprogress=e=>{
  if(!e.lengthComputable)return;
  const now=Date.now(),done=offset+e.loaded;last=now;item.progress=done/item.file.size;item.from=offset;
  samples.push([now,done]);while(samples.length>2&&now-samples[0][0]>6000)samples.shift();
  const [t0,d0]=samples[0];if(now>t0+800){item.speed=(done-d0)/((now-t0)/1000);item.left=item.speed>1?(item.file.size-done)/item.speed:-1;}
  render();
 };
 const done=()=>clearInterval(watch);
 xhr.onload=()=>{done();let body={};try{body=JSON.parse(xhr.responseText);}catch{}resolve({status:xhr.status,body});};
 xhr.onerror=()=>{done();reject(new Error('network'));};
 xhr.onabort=()=>{done();reject(stalled?new Error('network'):fail(text('Transfer cancelled'),true));};
 xhr.send(item.file.slice(offset));
});}
async function upload(item,index,count){
 const folder=$('folder').value.trim();let failures=0,offset=await kept(item);
 await info();
 if(offset>=0&&free>=0&&item.file.size-offset+(8<<20)>free)throw fail(text('Not enough free space on the SD card'),false);
 if(item.video&&item.video.saved&&item.video.saved!==item.video.file.name&&item.name===item.file.name){
  // The video was saved under another name (a copy of it existed): keep the subtitle beside it.
  const stem=n=>n.replace(/\.[^.]+$/,''),old=stem(item.video.file.name);
  if(item.file.name.startsWith(old))item.name=stem(item.video.saved)+item.file.name.slice(old.length);
 }
 item.speed=0;item.left=-1;
 for(;;){
  if(stopped)throw fail(text('Transfer cancelled'),true);
  if(offset<0){ // the question itself failed: the connection is down
   if(++failures>12)throw fail(text('Transfer interrupted. Try again.'),true);
   item.state='Reconnecting…';render();await pause(Math.min(2000*failures,15000));offset=await kept(item);continue;
  }
  item.from=offset;item.progress=offset/item.file.size;item.state='Sending';render();
  try{
   const before=offset,r=await put(item,offset,index,count,folder);
   if(r.status===200&&r.body.saved){item.saved=r.body.saved;return;}
   if(typeof r.body.offset==='number'&&(r.status===200||r.status===409)){
    // The receiver says where its copy ends: carry on from there (giving up if that never moves forward).
    if(r.body.offset>before)failures=0;else if(++failures>12)throw fail(r.body.error||text('Transfer interrupted. Try again.'),true);
    offset=r.body.offset;item.state='Reconnecting…';render();await pause(1000);continue;
   }
   throw fail(r.body.error||text('Transfer interrupted. Try again.'),r.status===409);
  }catch(e){
   if(e.final)throw e;
   if(stopped)throw fail(text('Transfer cancelled'),true);
   const before=offset;item.state='Reconnecting…';render();await pause(1500);
   offset=await kept(item);
   if(offset>before)failures=0;else if(++failures>12)throw fail(text('Transfer interrupted. Try again.'),true);
  }finally{request=null;}
 }
}
async function run(){
 if(active)return;active=true;stopped=false;render();
 const queue=items.filter(x=>x.state==='Waiting');let n=0;
 for(const item of queue){if(stopped)break;
  n++;
  const problem=!item.file.size||item.file.size>MAX?'Choose a file smaller than 2 GB':badName(item.file.name,180)||!ALLOWED.test(item.file.name)?'Unsupported file type or filename':badName($('folder').value.trim(),60)&&$('folder').value.trim()?'Unsupported folder name':'';
  if(problem){item.state='Error';item.error=text(problem);showCheck(item);render();continue;}
  item.state='Sending';item.error='';$('summary').textContent=text('Sending')+' · '+(queue.length>1?fill('File %d of %d',n,queue.length)+' · ':'')+item.file.name;render();
  try{await upload(item,n,queue.length);item.state='Saved';item.progress=1;item.error='';}
  catch(error){item.state=stopped?'Transfer cancelled':'Error';item.error=error.message;if(error.stop||stopped)stopped=true;}
  finally{request=null;item.speed=0;render();}
  info();
 }
 active=false;render();
 $('summary').textContent=items.every(x=>x.state==='Saved')?text('All files saved')+' · '+text("Close this page when you're done."):text('Ready to receive');
}
$('send').onclick=run;$('cancel').onclick=()=>{stopped=true;if(request)request.abort();};$('retry').onclick=()=>{items.forEach(x=>{if(x.state==='Error'||x.state==='Transfer cancelled'){x.state='Waiting';x.error='';x.progress=0;}});run();};
window.addEventListener('beforeunload',event=>{if(active){event.preventDefault();event.returnValue='';}});
info();
</script></body></html>
